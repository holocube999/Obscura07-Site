name: Verify public Sellone Viewer
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'assets/obscura-webplayer*.js'
      - 'webplayer/**'
      - 'catalog.json'
      - 'index.html'
      - 'tests/viewer.test.mjs'
      - 'tests/viewer.smoke.test.mjs'
      - 'tests/viewer.bundler.test.mjs'
      - 'tests/viewer.catalog.test.mjs'
      - 'tests/viewer.layout.test.mjs'
      - 'tests/viewer.fullscreen-drag.test.mjs'
      - '.github/workflows/verify-viewer.yml'
  pull_request:
    paths:
      - 'viewer/**'
      - 'assets/obscura-webplayer*.js'
      - 'tests/viewer*.test.mjs'
      - '.github/workflows/verify-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify no-npm JavaScript syntax
        run: |
          for file in viewer/catalog.js viewer/sellone-ui.js viewer/catalog-organizer.js viewer/catalog-ui.js viewer/github-runtime.js viewer/web-bundler.js viewer/retro-runtime.js viewer/retro/emu.js viewer/retro/sw.js assets/obscura-webplayer-runtime.js assets/obscura-webplayer.min.js; do
            node --check "$file"
          done
      - name: Verify Sellone NULLGOD persistent storage acknowledgement
        run: node viewer/tests/nullgod-storage-ack.test.cjs
      - name: Verify private app GitHub API request quota
        run: node viewer/tests/github-rate-budget.test.cjs
      - name: Verify playable assets, public deep-links, and proprietary media gate
        run: node --test tests/viewer.test.mjs tests/viewer.smoke.test.mjs tests/viewer.bundler.test.mjs tests/viewer.catalog.test.mjs tests/viewer.layout.test.mjs tests/viewer.fullscreen-drag.test.mjs
