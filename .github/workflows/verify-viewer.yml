name: Verify public Sellone Viewer
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'webplayer/**'
      - 'catalog.json'
      - 'index.html'
      - 'tests/viewer.test.mjs'
      - 'tests/viewer.smoke.test.mjs'
      - 'tests/viewer.bundler.test.mjs'
      - '.github/workflows/verify-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify no-npm JavaScript syntax
        run: |
          for file in viewer/catalog.js viewer/github-runtime.js viewer/web-bundler.js viewer/retro-runtime.js viewer/retro/emu.js viewer/retro/sw.js; do
            node --check "$file"
          done
      - name: Verify playable assets, public deep-links, and proprietary media gate
        run: node --test tests/viewer.test.mjs tests/viewer.smoke.test.mjs tests/viewer.bundler.test.mjs
