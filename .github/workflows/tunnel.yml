name: GitHub viewer capability bridge
on:
  push:
    paths:
      - 'viewer/**'
      - 'catalog.json'
      - '.github/workflows/tunnel.yml'
  pull_request:
    paths:
      - 'viewer/**'
      - 'catalog.json'
      - '.github/workflows/tunnel.yml'
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse viewer scripts
        run: |
          node --check viewer/catalog.js
          node --check viewer/host-bridge.js
          node --check viewer/tests/github-capability-bridge.cjs
      - name: Browser test dependencies
        run: npm install --no-save playwright-core@1.56.1
      - name: Real Chromium sandbox capability bridge
        run: node viewer/tests/github-capability-bridge.cjs
