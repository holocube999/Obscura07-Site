<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=../viewer/">
<meta name="referrer" content="no-referrer"><title>Sellone WebPlayer</title>
</head><body style="background:#0b0d17;color:#e8e7ef;font:16px system-ui;padding:28px">
<p>Sellone WebPlayer è stato unificato nel catalogo progetti.</p>
<p><a href="../viewer/" style="color:#c9b7ff">Apri Sellone WebPlayer</a></p>
<script>
'use strict';
const query=new URLSearchParams(location.search);
const aliases={maddoctor:'JSDoctor-MadDoctor',robocop3:'RoboCop3-JS'};
const alias=aliases[(query.get('game')||'').toLowerCase()];
const repo=(query.get('repo')||query.get('project')||alias||'').replace(/^holocube999\//i,'');
const url=new URL('../viewer/',location.href);
if(/^[A-Za-z0-9_.-]{1,100}$/.test(repo)){
 url.searchParams.set('repo',repo);
 const ref=query.get('ref'),path=query.get('path');
 if(/^[a-f0-9]{40}$/i.test(ref||'')&&/^(?:[A-Za-z0-9_.-]+\/){0,5}[A-Za-z0-9_.-]+\.html?$/i.test(path||'')){
  url.searchParams.set('ref',ref);url.searchParams.set('path',path);
 }
}
location.replace(url.href);
</script></body></html>
